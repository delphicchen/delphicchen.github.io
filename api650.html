  const key = await crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:unb64(BLOB.salt), iterations:BLOB.iter},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(BLOB.iv)}, key, unb64(BLOB.ct));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
const msg = document.getElementById("msg"), go = document.getElementById("go");
function getSaved(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
function setSaved(v){ try{ if(v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); }catch(e){} }
async function tryOpen(pw, fromSaved){
  go.disabled = true; msg.textContent = ""; go.textContent = "解密中… / Decrypting…";
  try{
    const html = await unlock(pw);
    if(!fromSaved) setSaved(document.getElementById("rm").checked ? pw : null);
    show(html);
  }catch(e){
    go.disabled = false; go.textContent = "開啟 / Open";
    if(fromSaved){ setSaved(null); }
    else { msg.textContent = "密碼不正確，請再試一次。 / Wrong password, please try again."; }
    const f = document.getElementById("pw"); f.focus(); f.select();
  }
}
if(!window.crypto || !crypto.subtle){
  msg.textContent = "此瀏覽器無法解密，請改用 Chrome、Edge 或 Safari 以 https 網址開啟。 / This browser cannot decrypt; open the https URL in Chrome, Edge or Safari.";
  go.disabled = true;
}else{
  document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); tryOpen(document.getElementById("pw").value, false); });
  const saved = getSaved();
  if(saved) tryOpen(saved, true); else document.getElementById("pw").focus();
}
</script>
