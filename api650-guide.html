<style>
:root{--bg:#f2f1ed;--surface:#fff;--fg:#1b1e22;--muted:#5f6771;--line:#c9c5bb;--accent:#8a4316;--accent-ink:#fff;--err:#b3261e;color-scheme:light}
:root[data-theme="dark"]{--bg:#111315;--surface:#1b1e22;--fg:#e7e9ec;--muted:#99a1ab;--line:#454c55;--accent:#eba77b;--accent-ink:#1a0f08;--err:#f28b82;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:420px;margin:0 auto;padding:18vh 16px 32px}
.code{font:600 30px/1.1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--accent);margin:0 0 6px}
h1{font-size:22px;line-height:1.35;margin:0 0 8px;font-weight:600}
p{margin:0 0 18px;color:var(--muted)}
input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
label.rm{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:16px;color:var(--muted)}
label.rm input{width:auto;accent-color:var(--accent)}
button{width:100%;margin-top:14px;min-height:50px;font:inherit;font-size:18px;font-weight:700;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{min-height:1.6em;margin:12px 0 0;color:var(--err);font-weight:600}
</style>

async function unlock(pw){

  const key = await crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:unb64(BLOB.salt), iterations:BLOB.iter},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);

  go.disabled = true; msg.textContent = ""; go.textContent = "Decrypting…";
  try{
    const html = await unlock(pw.trim());
    if(!fromSaved) setSaved(document.getElementById("rm").checked ? pw.trim() : null);
    show(html);
  }catch(e){
    go.disabled = false; go.textContent = "Open";
    if(fromSaved){ setSaved(null); }
    else { msg.textContent = "Wrong password, please try again. 密碼不正確，請再試一次。"; }
    const f = document.getElementById("pw"); f.focus(); f.select();
  }
}
if(!window.crypto || !crypto.subtle){
  msg.textContent = "This browser cannot decrypt the page. Please open the https link in Chrome, Edge or Safari.";
  go.disabled = true;
}else{
  document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); tryOpen(document.getElementById("pw").value, false); });
  const saved = getSaved();
  if(saved) tryOpen(saved, true); else document.getElementById("pw").focus();
}
</script>
</body>
</html>
