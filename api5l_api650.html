<style>
:root{--bg:#f3f2ee;--surface:#fff;--fg:#1b1e22;--muted:#5b636d;--line:#c9c5bb;--accent:#1d4f7a;--accent-ink:#fff;--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--surface:#1a1d21;--fg:#e7e9ec;--muted:#a3abb4;--line:#424951;--accent:#86b8e4;--accent-ink:#0e1a26;--err:#f28b82;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:420px;margin:0 auto;padding:16vh 16px 32px}
.eyebrow{font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-size:24px;line-height:1.25;margin:0 0 8px}
p{margin:0 0 18px;color:var(--muted)}
input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);letter-spacing:.12em}
input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
label.rm{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}
label.rm input{width:auto;accent-color:var(--accent)}
button{width:100%;margin-top:14px;min-height:50px;font:inherit;font-size:18px;font-weight:700;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{min-height:1.6em;margin:12px 0 0;color:var(--err);font-weight:600}
</style>
</head>

const KEY = "apiSpecPw";
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:unb64(BLOB.salt), iterations:BLOB.iter},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(BLOB.iv)}, key, unb64(BLOB.ct));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
const msg = document.getElementById("msg"), go = document.getElementById("go");
function getSaved(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
function setSaved(v){ try{ if(v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); }catch(e){} }
async function tryOpen(pw, fromSaved){
  go.disabled = true; msg.textContent = ""; go.textContent = "解密中… / Decrypting…";
  try{
    const html = await unlock(pw);
    if(!fromSaved) setSaved(document.getElementById("rm").checked ? pw : null);
    show(html);
  }catch(e){
    go.disabled = false; go.textContent = "開啟 / Open";
    if(fromSaved){ setSaved(null); }
    else { msg.textContent = "密碼不正確，請再試一次。 / Wrong password, please try again."; }
    const f = document.getElementById("pw"); f.focus(); f.select();
  }
}
if(!window.crypto || !crypto.subtle){
  msg.textContent = "此瀏覽器無法解密，請改用 Chrome、Edge 或 Safari 以 https 網址開啟。 / This browser cannot decrypt; open the https URL in Chrome, Edge or Safari.";
  go.disabled = true;
}else{
  document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); tryOpen(document.getElementById("pw").value, false); });
  const saved = getSaved();
  if(saved) tryOpen(saved, true); else document.getElementById("pw").focus();
}
</script>
